# Rate limiting на ingress (см. nginx.conf: include /etc/nginx/conf.d/*.conf).
# Зоны объявляются на уровне http; применение — limit_req в server/location.
#
# Риск №8 (низкий приоритет, помечен): IP мобильных операторов общий (NAT/CIDR),
# лимит по IP задевает честных пользователей. Основной ключ — X-Telegram-User-Id
# (JWT раскладывать на ingress нельзя, ADR-0007); IP-зона остаётся fallback'ом
# на случай отсутствия заголовка.

# Публичное API: 100 RPS/юзер; fallback 300 RPS/IP.
limit_req_zone $http_x_telegram_user_id zone=public_user:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=public_ip:10m rate=300r/s;

# Auth: строже, защита от перебора init-data (по юзеру).
limit_req_zone $http_x_telegram_user_id zone=auth_user:10m rate=10r/s;

# Боты: лимит по API-ключу, 500 RPS/key.
limit_req_zone $http_x_bot_api_key zone=bots:10m rate=500r/s;

# Пример применения в server-блоке (раскомментировать при появлении server-конфигов):
