# Дашборды из репозитория подхватываются автоматически (MVP #9).
apiVersion: 1

providers:
  - name: scootly
    orgId: 1
    folder: Scootly
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
